name: CI

on:
    push:
        branches: [master] # every push to master
    pull_request: # every pull request

jobs:
    check:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4 # get the code
            - uses: actions/setup-node@v4 # install Node
              with:
                  node-version: 22
                  cache: npm
            - run: npm ci # install exact dependencies from package-lock.json
            - run: npm run lint
            - run: npm test
            - run: npm run build # also type-checks

    browser-tests:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4
            - uses: actions/setup-node@v4
              with:
                  node-version: 22
                  cache: npm
            - run: npm ci
            - run: npx playwright install --with-deps chromium # the browser the tests drive
            - run: npm run test:e2e # builds the site, serves it, and clicks through every tool
            - uses: actions/upload-artifact@v4 # the report, with a recording of any failed test
              if: failure()
              with:
                  name: playwright-report
                  path: playwright-report/
                  retention-days: 14
